  <title>OpenMap</title>

  <!-- Consent Mode v2. This must stay above the Analytics and AdSense tags: both
       read the default consent state as they initialise, and anything they queue
       before it is set is treated as granted. Only a stored "accepted" counts as
       consent, so closing the banner leaves tracking off. Key is duplicated from
       CookieConsentBanner.tsx because this runs before any module loads. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    (function () {
      var granted = false;
      try {
        granted = localStorage.getItem('cookieConsent_v2') === 'accepted';
      } catch (e) {
        // localStorage blocked (private mode); stay denied.
      }
      var state = granted ? 'granted' : 'denied';
      gtag('consent', 'default', {
        ad_storage: state,
        ad_user_data: state,
        ad_personalization: state,
        analytics_storage: state,
        functionality_storage: 'granted',
        security_storage: 'granted'
      });
    })();
  </script>

  <!-- Google Analytics (gtag.js) -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-53D6VNT5');</script>
  <!-- End Google Tag Manager -->
