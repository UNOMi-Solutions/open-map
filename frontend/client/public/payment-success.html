<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Payment Successful - OpenMap</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0; min-height:100vh; font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:#0f172a; color:#fff; display:flex; align-items:center; justify-content:center; padding:24px}
    .card{background:#1e293b; border-radius:12px; padding:48px; max-width:480px; width:100%; text-align:center; box-shadow:0 4px 24px rgba(0,0,0,0.3)}
    .icon{width:64px; height:64px; margin:0 auto 24px; background:#10b981; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:32px}
    h1{font-size:24px; margin:0 0 12px; color:#fff}
    .sub{color:#94a3b8; font-size:16px; margin:0 0 24px; line-height:1.5}
    .plan{background:#334155; padding:12px 20px; border-radius:8px; margin-bottom:24px; font-weight:600; color:#93c5fd}
    .btn{display:inline-block; background:#dc2626; color:#fff; padding:14px 28px; border-radius:8px; text-decoration:none; font-weight:600; font-size:16px; transition:background 0.2s}
    .btn:hover{background:#b91c1c}
    .note{font-size:13px; color:#64748b; margin-top:24px}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1>Payment Successful</h1>
    <p class="sub">Thank you for subscribing to OpenMap. Your payment has been processed.</p>
    <div class="plan" id="plan-name">Subscription</div>
    <p class="note">A confirmation email has been sent to your email address.</p>
    <a href="/" class="btn">Back to Home</a>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const planNames = {
      freeTrial: 'Free Trial',
      premium: 'Premium',
      enterprise: 'Enterprise',
      agency: 'Agency',
    };
    const intervalNames = { monthly: 'Monthly', yearly: 'Yearly' };
    const plan = params.get('plan');
    const interval = params.get('interval');
    const planLabel = planNames[plan] || 'Subscription';
    const intervalLabel = intervalNames[interval] || '';
    document.getElementById('plan-name').textContent =
      (planLabel + ' ' + intervalLabel).trim();
  </script>
</body>
</html>
